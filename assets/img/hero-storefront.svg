<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-label="Parkdale Cleaners storefront with garments hanging in the window">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset="1" stop-color="#fbf7f0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dceaf4"/>
      <stop offset="1" stop-color="#eef5fa"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f2e9"/>
    </linearGradient>
    <clipPath id="awningClip">
      <path d="M104,232 L120,186 L532,186 L548,232
               a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0
               a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0
               a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0
               a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0 Z"/>
    </clipPath>
    <g id="hanger-hook">
      <path d="M0,-4 c0,-7 9,-7 9,-1" fill="none" stroke="#14273f" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- backdrop -->
  <rect width="640" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="520" cy="90" r="150" fill="#e9f1f7" opacity=".7"/>

  <!-- steam rising from the shop -->
  <g fill="none" stroke="#8fb3cf" stroke-width="4.5" stroke-linecap="round" opacity=".5">
    <path d="M124,80 c14,-16 -12,-28 2,-44 c9,-11 -1,-19 -1,-26"/>
    <path d="M166,80 c11,-13 -9,-22 1,-34 c7,-9 0,-14 0,-19"/>
    <path d="M498,80 c12,-14 -10,-24 1,-37"/>
  </g>

  <!-- sidewalk -->
  <rect x="0" y="470" width="640" height="90" fill="#ece3d4"/>
  <path d="M0,470 H640" stroke="#ddd2be" stroke-width="2"/>
  <g stroke="#ddd2be" stroke-width="2" opacity=".8">
    <path d="M180,470 V560"/><path d="M340,470 V560"/><path d="M500,470 V560"/>
    <path d="M0,516 H640"/>
  </g>

  <!-- building -->
  <rect x="80" y="96" width="480" height="374" fill="url(#wall)"/>
  <rect x="68" y="82" width="504" height="22" rx="7" fill="#14273f"/>

  <!-- sign board -->
  <rect x="118" y="120" width="404" height="52" rx="10" fill="#14273f"/>
  <rect x="124" y="126" width="392" height="40" rx="7" fill="none" stroke="#c19849" stroke-width="1.5" opacity=".55"/>
  <text x="320" y="153" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="23" letter-spacing="4.5" fill="#e6c982">PARKDALE CLEANERS</text>

  <!-- awning -->
  <g clip-path="url(#awningClip)">
    <rect x="104" y="180" width="444" height="60" fill="#fbf7f0"/>
    <g fill="#14273f">
      <rect x="104" y="180" width="37" height="60"/>
      <rect x="178" y="180" width="37" height="60"/>
      <rect x="252" y="180" width="37" height="60"/>
      <rect x="326" y="180" width="37" height="60"/>
      <rect x="400" y="180" width="37" height="60"/>
      <rect x="474" y="180" width="37" height="60"/>
    </g>
  </g>
  <path d="M104,232 L120,186 L532,186 L548,232
           a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0
           a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0
           a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0
           a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0 a18.5,18.5 0 0 1 -37,0 Z"
        fill="none" stroke="#14273f" stroke-width="3" stroke-linejoin="round"/>
  <rect x="104" y="252" width="444" height="14" fill="#14273f" opacity=".06"/>

  <!-- window -->
  <rect x="118" y="256" width="270" height="196" rx="5" fill="url(#glass)" stroke="#14273f" stroke-width="3.5"/>
  <path d="M253,256 V452" stroke="#14273f" stroke-width="3"/>
  <path d="M138,452 L228,276 M178,452 L268,276" stroke="#ffffff" stroke-width="14" opacity=".35" stroke-linecap="round"/>

  <!-- garment rail -->
  <path d="M134,298 H372" stroke="#14273f" stroke-width="3" stroke-linecap="round"/>

  <!-- garments -->
  <g transform="translate(165,298)">
    <use href="#hanger-hook"/>
    <path d="M0,6 L-24,14 L-20,25 L-14,22 L-14,78 L14,78 L14,22 L20,25 L24,14 Z"
          fill="#ffffff" stroke="#14273f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-7,6 L0,14 L7,6" fill="none" stroke="#14273f" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <g transform="translate(216,298)">
    <use href="#hanger-hook"/>
    <path d="M0,8 L-16,16 L-11,36 L-21,88 L21,88 L11,36 L16,16 Z"
          fill="#e6c982" stroke="#14273f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-11,36 H11" stroke="#14273f" stroke-width="1.6" opacity=".5"/>
  </g>

  <g transform="translate(292,298)">
    <use href="#hanger-hook"/>
    <path d="M0,6 L-25,16 L-27,92 L27,92 L25,16 Z"
          fill="#14273f" stroke="#14273f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M0,8 L-9,32 M0,8 L9,32" fill="none" stroke="#8fb3cf" stroke-width="1.8"/>
    <circle cx="0" cy="46" r="2.4" fill="#e6c982"/>
    <circle cx="0" cy="60" r="2.4" fill="#e6c982"/>
  </g>

  <g transform="translate(347,298)">
    <use href="#hanger-hook"/>
    <path d="M0,6 L-24,14 L-20,25 L-14,22 L-14,78 L14,78 L14,22 L20,25 L24,14 Z"
          fill="#dbe7f2" stroke="#14273f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-7,6 L0,14 L7,6" fill="none" stroke="#14273f" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- window sill -->
  <rect x="110" y="452" width="286" height="11" rx="3" fill="#14273f"/>

  <!-- door -->
  <rect x="420" y="256" width="100" height="196" rx="5" fill="#f6f1e8" stroke="#14273f" stroke-width="3.5"/>
  <rect x="434" y="270" width="72" height="96" rx="4" fill="url(#glass)" stroke="#14273f" stroke-width="2.5"/>
  <rect x="434" y="386" width="72" height="52" rx="4" fill="none" stroke="#14273f" stroke-width="2" opacity=".4"/>
  <rect x="502" y="348" width="6" height="24" rx="3" fill="#c19849"/>
  <!-- OPEN sign -->
  <rect x="450" y="296" width="42" height="20" rx="4" fill="#14273f"/>
  <text x="471" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="11"
        letter-spacing="1.5" fill="#e6c982">OPEN</text>

  <!-- planter -->
  <path d="M584,470 v-26 c-16,-4 -22,-18 -18,-32 14,2 22,12 22,26 c2,-14 12,-22 26,-22 2,16 -8,28 -24,28"
        fill="#8fb3cf" opacity=".55"/>
  <path d="M568,470 h34 l-4,22 h-26 Z" fill="#c19849"/>

  <!-- ground shadow -->
  <ellipse cx="320" cy="474" rx="250" ry="9" fill="#14273f" opacity=".07"/>
</svg>
