<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Same-day service">
  <circle cx="60" cy="60" r="56" fill="#f3ece0"/>

  <!-- speed marks -->
  <g stroke="#c19849" stroke-width="3.4" stroke-linecap="round">
    <path d="M12,44 h12"/><path d="M8,58 h18"/><path d="M14,72 h10"/>
  </g>

  <!-- clock -->
  <circle cx="58" cy="52" r="28" fill="#14273f"/>
  <circle cx="58" cy="52" r="22" fill="none" stroke="#8fb3cf" stroke-width="2" opacity=".5"/>
  <path d="M58,36 v16 h11" fill="none" stroke="#e6c982" stroke-width="3.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- freshly pressed shirt -->
  <g transform="translate(80,80)">
    <circle cx="0" cy="0" r="24" fill="#f3ece0"/>
    <path d="M-5,-18 L-15,-13 L-12,-6 L-8,-8 v22 h16 v-22 l4,2 3,-7 L-5,-18 Z"
          fill="#ffffff" stroke="#14273f" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-5,-18 L0,-12 L5,-18" fill="none" stroke="#14273f" stroke-width="2.6" stroke-linejoin="round"/>
  </g>
</svg>
